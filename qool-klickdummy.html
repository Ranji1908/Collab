/* Layout: App-Shell mit Kopfleiste + Schrittnavigation, darunter je Schritt ein Arbeitsbereich; Bearbeitung zweispaltig (Kontaktpunktliste | Kriterien). Farben aus Birgits Vorgaben (DTV-Blau #0063a3, Rot #c9070a, Grün #93b05d, Grau #857f76). */
:root {

  --surface-2: #eef2f6;
  --fg: #1d2329;
  --muted: #5d656d;
  --line: #d9dee3;
  --accent: #0063a3;
  --accent-soft: #99c1da;      /* #0063a3, 40 % */
  --accent-fg: #ffffff;
  --danger: #c9070a;
  --ok: #93b05d;
  --warn: #f39100;
  --r0: #9c0b19; --r1: #c9070a; --r2: #f39100; --r3: #93b05d; --r4: #779048; --r5: #5a6e3a; --rn: #b6b2ad;
  --hint-bg: #fff6e5; --hint-fg: #7a4a00;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13171b; --surface: #1b2127; --surface-2: #222a32; --fg: #e6e9ec; --muted: #9aa3ab; --line: #333c45;
  --accent: #4a9fd8; --accent-soft: #1f4763; --accent-fg: #0b1620; --hint-bg: #3a2c12; --hint-fg: #f5cf8f; --rn: #6d6964; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #13171b; --surface: #1b2127; --surface-2: #222a32; --fg: #e6e9ec; --muted: #9aa3ab; --line: #333c45;
  --accent: #4a9fd8; --accent-soft: #1f4763; --accent-fg: #0b1620; --hint-bg: #3a2c12; --hint-fg: #f5cf8f; --rn: #6d6964; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5 }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.2 }
h1 { font-size: 1.75rem } h2 { font-size: 1.35rem } h3 { font-size: 1.1rem }
p { margin: 0 }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.num { font-variant-numeric: tabular-nums }

/* Kopf */
.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20 }
.top-in { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px }
.brand { display: flex; align-items: baseline; gap: 10px }
.brand b { font-family: var(--font-display); font-size: 1.5rem; color: var(--accent); letter-spacing: .01em }
.brand span { color: var(--muted); font-size: .85rem }
.top-meta { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: .85rem }
.dummy { background: var(--hint-bg); color: var(--hint-fg); padding: 2px 8px; border-radius: 99px; font-weight: 600; font-size: .75rem; letter-spacing: .03em; text-transform: uppercase }
.role { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden }
.role button { border: 0; background: transparent; padding: 3px 10px; font-size: .8rem }
.role button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg) }
nav.steps { max-width: 1200px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto }
nav.steps button { border: 0; background: none; padding: 8px 12px 10px; border-bottom: 3px solid transparent; white-space: nowrap; color: var(--muted); font-weight: 600 }
nav.steps button[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent) }
nav.steps small { font-weight: 400; margin-right: 4px }

main { max-width: 1200px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: grid; gap: 20px }
.lead { color: var(--muted); max-width: 70ch }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px }
.eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600 }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: var(--radius); font-weight: 600 }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #142008 }
.btn.danger { color: var(--danger); border-color: var(--danger) }
.btn:disabled { opacity: .45; cursor: not-allowed }
.btn.sm { padding: 4px 10px; font-size: .85rem }
.link { border: 0; background: none; color: var(--accent); padding: 0; font-weight: 600; text-decoration: underline; text-underline-offset: 2px }

.hint { background: var(--hint-bg); color: var(--hint-fg); border-radius: var(--radius); padding: 10px 14px; font-size: .9rem }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 99px; font-size: .75rem; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap }
.chip.ai { background: var(--accent-soft); color: var(--fg) }
.chip.p { background: var(--surface-2); color: var(--fg) }
.pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-weight: 700; font-size: .8rem }
.st-Entwurf { background: var(--surface-2) } .st-Eingereicht { background: var(--accent-soft) } .st-Nachbesserung { background: var(--warn); color: #2b1a00 } .st-Freigegeben { background: var(--ok); color: #142008 }

/* Website-Check */
.check-form { display: grid; grid-template-columns: 1fr 220px auto; gap: 10px; align-items: end }
@media (max-width: 700px) { .check-form { grid-template-columns: 1fr } }
label.f { display: grid; gap: 4px; font-size: .85rem; font-weight: 600 }
input[type=text], input[type=url], input[type=date], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; width: 100%; min-width: 0 }
textarea { min-height: 70px; resize: vertical }
.scanlog { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: .9rem }
.scanlog li::before { content: "○ "; color: var(--muted) }
.scanlog li.done::before { content: "✓ "; color: var(--ok); font-weight: 700 }
.finding { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line) }
.finding:first-child { border-top: 0 }
.finding .sc { width: 30px; height: 30px; border-radius: 4px; display: grid; place-items: center; color: #fff; font-weight: 700 }
.finding small { color: var(--muted); display: block }

/* Schaltzentrale */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.kpi { background: var(--accent-soft); border-radius: var(--radius); padding: 10px 12px }
.kpi .eyebrow { color: var(--fg); opacity: .75 }
.kpi b { display: block; font-size: 1.15rem; font-family: var(--font-display) }
.kpi.over { background: var(--danger); color: #fff }
.bar { height: 6px; background: var(--surface); border-radius: 99px; overflow: hidden; margin-top: 6px }
.bar i { display: block; height: 100%; background: var(--accent) }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px }
.tile { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 8px; background: var(--surface) }
.tile.done { border-color: var(--ok); box-shadow: inset 4px 0 0 var(--ok) }
.tile.locked { opacity: .6 }
.team { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px }
.team li { display: flex; gap: 10px; align-items: center }
.av { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; font-size: .75rem; font-weight: 700; flex: none }
svg text { fill: var(--fg) }

/* Auswahl Kontaktpunkte / Handlungsfelder */
.phase { display: grid; gap: 10px }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px }
.sel { position: relative; border: 2px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 12px 12px 10px; text-align: left; display: grid; gap: 6px; min-height: 104px; align-content: start }
.sel[aria-pressed="true"] { border-color: var(--accent); background: var(--surface-2) }
.sel .ic { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700 }
.sel .nm { font-weight: 600; line-height: 1.25 }
.sel .meta { font-size: .75rem; color: var(--muted) }
.sel .lock { position: absolute; top: 8px; right: 8px; font-size: .8rem }
.sel .info { position: absolute; bottom: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: .75rem; font-weight: 700; padding: 0 }
.sel .warnx { color: var(--danger); font-weight: 600 }

/* Bearbeitung */
.work { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 16px; align-items: start }
@media (max-width: 860px) { .work { grid-template-columns: 1fr } }
.kplist { list-style: none; margin: 0; padding: 6px; display: grid; gap: 2px; position: sticky; top: 110px; max-height: calc(100vh - 130px); overflow: auto }
@media (max-width: 860px) { .kplist { position: static; max-height: none } }
.kplist button { width: 100%; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 4px; display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center }
.kplist button[aria-current="true"] { background: var(--surface-2); font-weight: 700 }
.dot { width: 12px; height: 12px; border-radius: 50% }
.d-rot { background: var(--danger) } .d-orange { background: var(--warn) } .d-gruen { background: var(--ok) } .d-leer { background: var(--rn) }
.legend { display: flex; flex-wrap: wrap; gap: 6px; font-size: .8rem }
.legend span { display: inline-flex; gap: 5px; align-items: center }
.legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block }
.hf { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 4px }
.hf-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 4px }
.crit { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px 12px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line) }
@media (max-width: 640px) { .crit { grid-template-columns: 1fr auto } .crit .scale { grid-column: 1 / -1 } }
.crit .t small { display: block; color: var(--muted) }
.scale { display: flex; gap: 3px }
.scale button { width: 32px; height: 32px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; padding: 0 }
.scale button[aria-pressed="true"] { color: #fff; border-color: transparent }
.scale button.sug { outline: 2px dashed var(--accent); outline-offset: 1px }
.sugline { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .85rem; background: var(--surface-2); border-radius: 4px; padding: 6px 10px }
.kpfoot { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 14px }
.avg { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700 }

/* Drawer + Assistent */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40 }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); z-index: 41; overflow: auto; padding: calc(18px + env(safe-area-inset-top, 0px)) 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; align-content: start; box-shadow: -8px 0 24px rgba(0,0,0,.15) }
.drawer header { display: flex; justify-content: space-between; gap: 10px; align-items: start }
.x { border: 0; background: none; font-size: 1.4rem; line-height: 1; padding: 2px 6px }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; font-size: .9rem }
dl.kv dt { color: var(--muted) }
dl.kv dd { margin: 0 }
.expl { display: grid; gap: 4px; font-size: .85rem }
.expl div { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start }
.expl b { color: #fff; border-radius: 3px; text-align: center }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .9rem }
.checks label { display: inline-flex; gap: 6px; align-items: center }
.chat { display: grid; gap: 10px }
.msg { padding: 10px 12px; border-radius: 8px; max-width: 92%; font-size: .92rem }
.msg.bot { background: var(--surface-2) }
.msg.me { background: var(--accent); color: var(--accent-fg); justify-self: end }
.msg ul { margin: 6px 0 0; padding-left: 18px }

/* Kanban */
.kanban { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start }
@media (max-width: 860px) { .kanban { grid-template-columns: 1fr } }
.col { background: var(--surface-2); border-radius: var(--radius); padding: 10px; display: grid; gap: 8px; min-height: 160px; align-content: start }
.col.over { outline: 2px dashed var(--accent) }
.col h3 { display: flex; justify-content: space-between }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; display: grid; gap: 6px; cursor: grab }
.card.ai { border-style: dashed; border-color: var(--accent) }
.card .src { font-size: .78rem; color: var(--muted) }
.prio-hoch { background: var(--danger); color: #fff } .prio-mittel { background: var(--warn); color: #2b1a00 } .prio-niedrig { background: var(--surface-2); color: var(--fg) }
.avs { display: flex; gap: 2px }
.avs .av { width: 24px; height: 24px; font-size: .65rem }

.review { border: 2px solid var(--accent); }
table.t { width: 100%; border-collapse: collapse; font-size: .9rem }
table.t th, table.t td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line) }
.tw { overflow-x: auto }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 99px; z-index: 60; font-weight: 600 }
@media (prefers-reduced-motion: no-preference) { .toast { animation: up .2s ease-out } @keyframes up { from { transform: translate(-50%, 8px); opacity: 0 } } }
</style>

function critsOf(kp) {
  const out = [];
  HF.forEach((h, hi) => { if (!S.hfSel.includes(h.k)) return; for (let i = 0; i < kp.hf[hi]; i++) out.push({ hf: h.k, i, key: `${kp.id}|${h.k}|${i}` }); });
  return out;
}
function kpStats(kp) {
  const cs = critsOf(kp);
  const done = cs.filter(c => S.ratings[c.key] !== undefined);
  const nums = done.map(c => S.ratings[c.key]).filter(v => v !== "N");
  const avg = nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : null;
  const state = !cs.length ? "leer" : done.length === 0 ? "rot" : done.length < cs.length ? "orange" : "gruen";
  return { total: cs.length, done: done.length, avg, state };
}
function overall() {
  let t = 0, d = 0, nums = [];
  selKps().forEach(k => { const s = kpStats(k); t += s.total; d += s.done; critsOf(k).forEach(c => { const v = S.ratings[c.key]; if (v !== undefined && v !== "N") nums.push(v); }); });
  return { t, d, pct: t ? Math.round(d / t * 100) : 0, avg: nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : null };
}
function hfAverages() {
  return HF.map(h => {
    let nums = [];
    selKps().forEach(k => critsOf(k).filter(c => c.hf === h.k).forEach(c => { const v = S.ratings[c.key]; if (v !== undefined && v !== "N") nums.push(v); }));
    return { h, avg: nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : null, active: S.hfSel.includes(h.k) };
  });
}

function spider(vals) {
  const cx = 170, cy = 150, R = 105, n = vals.length;
  const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; };
  let g = "";
  for (let lv = 1; lv <= 5; lv++) g += `<polygon points="${vals.map((_, i) => pt(i, R * lv / 5).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  vals.forEach((_, i) => { const [x, y] = pt(i, R); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`; });
  [1,3,5].forEach(lv => { g += `<text x="${cx + 4}" y="${cy - R * lv / 5 + 4}" font-size="10" opacity=".6">${lv}</text>`; });
  const has = vals.filter(v => v.avg !== null);
  if (has.length >= 3) {
    g += `<polygon points="${vals.map((v, i) => pt(i, R * (v.avg ?? 0) / 5).join(",")).join(" ")}" fill="var(--accent-soft)" fill-opacity=".75" stroke="var(--accent)" stroke-width="2"/>`;
    vals.forEach((v, i) => { if (v.avg !== null) { const [x, y] = pt(i, R * v.avg / 5); g += `<circle cx="${x}" cy="${y}" r="4" fill="var(--accent)"/>`; } });
  }
  vals.forEach((v, i) => {
    const [x, y] = pt(i, R + 20); const anchor = Math.abs(x - cx) < 5 ? "middle" : x > cx ? "start" : "end";
    g += `<text x="${x}" y="${y}" font-size="11.5" text-anchor="${anchor}" opacity="${v.active ? 1 : .45}">${v.h.short} ${fmt(v.avg)}</text>`;
  });
  return `<svg viewBox="0 0 340 300" width="100%" style="max-width:380px" role="img" aria-label="Spinnendiagramm Durchschnitt je Handlungsfeld">${g}</svg>`;
}

      ${locked ? `<div class="hint">Die Servicekette ist ${S.status.toLowerCase()} und kann gerade nicht bearbeitet werden.</div>` : ""}
      ${HF.filter(h => S.hfSel.includes(h.k)).map(h => {

          ${Array.from({ length: cnt }, (_, i) => critRow(kp, h, i, locked)).join("")}
          ${custom.map((t, j) => critRow(kp, h, "c" + j, locked, t)).join("")}

function critRow(kp, h, i, locked, customText) {
  const key = `${kp.id}|${h.k}|${i}`, v = S.ratings[key], sg = S.sugg[key];
  const text = customText ?? critText(kp.id, h.k, i);
  const hasM = S.measures.some(m => m.kp === kp.id && m.hf === h.k && m.crit === i);
  return `<div class="crit">
    <div class="t">${customText ? '<span class="chip">eigenes Kriterium</span> ' : ""}${esc(text)}${S.notes[key] ? `<small>Notiz: ${esc(S.notes[key])}</small>` : ""}</div>
    <div class="scale" role="radiogroup" aria-label="Bewertung">${SCALE.map(s => `<button data-a="rate" data-k="${key}" data-v="${s}" aria-pressed="${v === s}" class="${v === undefined && sg && sg.v === s ? "sug" : ""}" style="${v === s ? `background:${SCORE[s][1]}` : ""}" ${locked ? "disabled" : ""} title="${SCORE[s][0]}">${s}</button>`).join("")}</div>
    <button class="btn sm" data-a="detail" data-k="${key}">${hasM ? "Maßnahme ✓" : "Details"}</button>
    ${v === undefined && sg ? `<div class="sugline"><span class="chip ai">Vorschlag ${sg.v}</span>${esc(sg.why)}<button class="btn sm" data-a="rate" data-k="${key}" data-v="${sg.v}">Übernehmen</button></div>` : ""}
  </div>`;
}

/* ---------- Overlays ---------- */
const layer = document.getElementById("layer");
function drawer(html) { layer.innerHTML = `<div class="scrim" data-a="close"></div><aside class="drawer" role="dialog" aria-modal="true">${html}</aside>`; layer.querySelector(".drawer button, .drawer input, .drawer textarea")?.focus(); }
function close() { layer.innerHTML = ""; }
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }

function infoDrawer(title, text) { drawer(`<header><div><div class="eyebrow">Definition</div><h2>${title}</h2></div><button class="x" data-a="close" aria-label="Schließen">×</button></header><p>${esc(text)}</p><button class="btn" data-a="close">Schließen</button>`); }

function measureForm(m, ctx) {
  return `
    <label class="f">Maßnahme<textarea id="m-text">${esc(m.text || "")}</textarea></label>
    <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">
      <label class="f">Priorität<select id="m-prio">${["hoch","mittel","niedrig"].map(p => `<option ${m.prio === p ? "selected" : ""}>${p}</option>`).join("")}</select></label>
      <label class="f">Status<select id="m-status">${["offen","in Bearbeitung","erledigt"].map(p => `<option ${m.status === p ? "selected" : ""}>${p}</option>`).join("")}</select></label>
      <label class="f">Start<input type="date" id="m-start" value="${m.start || ""}"></label>
      <label class="f">Ende<input type="date" id="m-end" value="${m.end || ""}"></label>
      <label class="f">Fortschritt<select id="m-prog">${Array.from({ length: 11 }, (_, i) => i * 10).map(p => `<option value="${p}" ${+m.progress === p ? "selected" : ""}>${p} %</option>`).join("")}</select></label>
    </div>
    <div style="display:grid;gap:4px"><span class="eyebrow">Verantwortlich ${ctx?.sug ? '<span class="chip ai">KI-Vorschlag vorausgewählt</span>' : ""}</span>
      <div class="checks">${TEAM.map(t => `<label><input type="checkbox" value="${t.id}" class="m-resp" ${m.resp?.includes(t.id) ? "checked" : ""}>${t.name} <small style="color:var(--muted)">${t.role}</small></label>`).join("")}</div></div>`;
}
function readForm() {
  return { text: document.getElementById("m-text").value.trim(), prio: document.getElementById("m-prio").value, status: document.getElementById("m-status").value,
    start: document.getElementById("m-start").value, end: document.getElementById("m-end").value, progress: +document.getElementById("m-prog").value,

}

function detailDrawer(key) {
  const [kpId, hfk, iRaw] = key.split("|"); const kp = KP.find(k => k.id === +kpId), h = HF[hfIdx(hfk)];
  const i = iRaw.startsWith("c") ? iRaw : +iRaw;
  const text = typeof i === "string" ? S.custom[`${kpId}|${hfk}`][+i.slice(1)] : critText(kp.id, hfk, i);
  const existing = S.measures.find(m => m.kp === kp.id && m.hf === hfk && m.crit === i);
  const m = existing || { prio: "mittel", status: "offen", progress: 0, resp: suggestResp(kp.id, hfk), text: "" };
  const v = S.ratings[key];
  drawer(`
    <header><div><div class="eyebrow">Detailansicht Kriterium</div><h2>${esc(text)}</h2></div><button class="x" data-a="close" aria-label="Schließen">×</button></header>
    <dl class="kv"><dt>Kontaktpunkt</dt><dd>${kp.name}</dd><dt>Handlungsfeld</dt><dd>${h.name}</dd><dt>Bewertung</dt><dd>${v === undefined ? "noch offen" : `${v} · ${SCORE[v][0]}`}</dd></dl>
    <div style="display:grid;gap:6px"><span class="eyebrow">Erläuterungen (aus dem CRM)</span>
      <div class="expl">${SCALE.map(s => `<div><b style="background:${SCORE[s][1]}">${s}</b><span>${s === "N" ? "Das Kriterium trifft auf den Betrieb nicht zu." : s === 0 ? "Gibt es nicht, obwohl es relevant wäre." : s === 5 ? "Vorbildlich umgesetzt, wird regelmäßig überprüft." : "Erläuterung zur Stufe folgt vom DTV."}</span></div>`).join("")}</div></div>
    <label class="f">Notizen<textarea id="d-note">${esc(S.notes[key] || "")}</textarea></label>
    <div style="display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px">
      <div class="row" style="justify-content:space-between"><h3>Maßnahme</h3><button class="btn sm" data-a="aitext" data-k="${key}">KI-Formulierung</button></div>
      ${measureForm(m, { sug: !existing })}
    </div>
    <div class="row"><button class="btn" data-a="close">Schließen</button><button class="btn primary" data-a="savedetail" data-k="${key}">Speichern</button></div>`);
}

const BOT = {
  gk: "Bei Gast/Kunde geht es um alles, was Besucher direkt erleben. Für eure TI passt dafür am besten Murat (Counter & Beratung).",
  ma: "Themen zu Mitarbeitenden betreffen Dienstpläne, Arbeitsplätze und Abläufe. Das entscheidet bei euch Sabine (Leitung).",
  ui: "Partner, Lieferanten und Region laufen bei euch über Sabine (Leitung).",
  oen: "Energie, Material und Müll fallen bei euch in die Haustechnik, also Peter.",
  dk: "Digitale Themen und Online-Auftritte betreut Jana (Marketing & Online).",
  bf: "Bauliche Barrierefreiheit gehört zu Peter (Haustechnik), barrierefreie Online-Inhalte zu Jana."
};
function botDrawer(hfk, extra = []) {
  const h = HF[hfIdx(hfk)], kp = KP.find(k => k.id === S.kp);
  const low = critsOf(kp).filter(c => c.hf === hfk && typeof S.ratings[c.key] === "number" && S.ratings[c.key] <= 2);
  drawer(`
    <header><div><div class="eyebrow">Assistent · ${h.name}</div><h2>${kp.name}</h2></div><button class="x" data-a="close" aria-label="Schließen">×</button></header>
    <div class="chat" id="chat">
      <div class="msg bot">Hallo! Ich helfe euch beim Handlungsfeld <b>${h.name}</b>. Ich kenne euer Team aus dem Teamversprechen und kann Maßnahmen vorschlagen und zuordnen.</div>
      ${extra.join("")}
    </div>
    <div class="row">
      <button class="btn sm" data-a="botq" data-v="${hfk}" data-q="who">Wer ist bei uns zuständig?</button>
      <button class="btn sm" data-a="botq" data-v="${hfk}" data-q="idea">Maßnahmen vorschlagen</button>
      <button class="btn sm" data-a="botq" data-v="${hfk}" data-q="explain">Was heißt „N“?</button>
    </div>
    <form class="row" data-f="botfree" data-v="${hfk}" style="flex-wrap:nowrap"><input type="text" id="botin" placeholder="Frage eingeben…" aria-label="Frage an den Assistenten"><button class="btn primary" type="submit">Senden</button></form>
    <p style="font-size:.8rem;color:var(--muted)">Klickdummy: Antworten sind vorbereitet. ${low.length} Kriterien in diesem Feld haben 0–2 Punkte.</p>`);
}
function botAnswer(hfk, q) {
  const kp = KP.find(k => k.id === S.kp);
  if (q === "who") return `<div class="msg bot">${BOT[hfk]}</div>`;
  if (q === "explain") return `<div class="msg bot">„N“ heißt: Das Kriterium gibt es bei euch nicht und es ist auch nicht relevant, z. B. WLAN in einem Raum ohne Aufenthalt. N fließt nicht in den Durchschnitt ein. Wenn etwas fehlt, aber sinnvoll wäre, nehmt 0.</div>`;
  const low = critsOf(kp).filter(c => c.hf === hfk && typeof S.ratings[c.key] === "number" && S.ratings[c.key] <= 2);
  if (!low.length) return `<div class="msg bot">In diesem Handlungsfeld gibt es beim ${kp.name} keine Kriterien mit 0–2 Punkten. Bewertet zuerst die Kriterien, dann schlage ich gezielt etwas vor.</div>`;
  const resp = suggestResp(kp.id, hfk).map(id => TEAM.find(t => t.id === id).name.split(" ")[0]).join(" und ");
  return `<div class="msg bot">Für diese Kriterien mit wenig Punkten schlage ich vor:<ul>${low.map(c => `<li>${esc(ideaFor(c))} <i>(zuständig: ${resp})</i> <button class="link" data-a="botadd" data-k="${c.key}">übernehmen</button></li>`).join("")}</ul></div>`;
}
function ideaFor(c) {
  const t = critText(+c.key.split("|")[0], c.hf, c.i);
  const map = { gk: "Klare Zuständigkeit im Dienstplan festlegen und Gästen sichtbar machen", ma: "Arbeitsabläufe mit dem Team besprechen und Engpässe beseitigen", ui: "Zwei regionale Partner gezielt ansprechen und Kooperation vereinbaren", oen: "Verbrauch erfassen und eine konkrete Einsparmaßnahme umsetzen", dk: "Digitales Angebot einrichten und auf der Website bewerben", bf: "Barriere prüfen lassen und kurzfristige Lösung umsetzen" };
  return `${map[c.hf]}: „${t.length > 70 ? t.slice(0, 68) + "…" : t}“`;
}

/* ---------- Aktionen ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v, k = el.dataset.k;
  if (a === "kpinfo" || a === "hfinfo") e.stopPropagation();
  switch (a) {
    case "go": S.view = v; close(); render(); scrollTo(0, 0); break;
    case "role": S.role = v; S.view = v === "team" ? "review" : "dash"; render(); break;
    case "reset": try { localStorage.removeItem(KEY); } catch (er) {} S = fresh(); ensureSel(); render(); toast("Dummy zurückgesetzt"); break;
    case "kp": { const kp = KP.find(x => x.id === +v); if (flag(kp) === "P") { toast("Pflicht-Kontaktpunkt, kann nicht abgewählt werden"); break; }
      S.kpSel = S.kpSel.includes(kp.id) ? S.kpSel.filter(x => x !== kp.id) : [...S.kpSel, kp.id]; render(); break; }
    case "kpinfo": { const kp = KP.find(x => x.id === +v); infoDrawer(kp.name, KPDEF[kp.id] || "Die Definition dieses Kontaktpunkts liefert der DTV."); break; }
    case "hf": { const h = HF[hfIdx(v)]; if (h.lock) { toast("Gast/Kunde ist Pflicht"); break; }
      S.hfSel = S.hfSel.includes(v) ? S.hfSel.filter(x => x !== v) : [...S.hfSel, v]; render(); break; }
    case "hfinfo": { const h = HF[hfIdx(v)]; infoDrawer(h.name, h.def); break; }
    case "selkp": S.kp = +v; render(); scrollTo(0, 0); break;
    case "rate": { const val = v === "N" ? "N" : +v; if (S.ratings[k] === val) delete S.ratings[k]; else S.ratings[k] = val; render(); break; }
    case "acceptall": critsOf(KP.find(x => x.id === S.kp)).forEach(c => { if (S.sugg[c.key] && S.ratings[c.key] === undefined) S.ratings[c.key] = S.sugg[c.key].v; }); render(); toast("Vorschläge übernommen"); break;
    case "nextkp": { const ks = selKps(), i = ks.findIndex(x => x.id === S.kp); S.kp = ks[(i + 1) % ks.length].id; render(); scrollTo(0, 0); toast("Zwischengespeichert"); break; }
    case "addcustom": { const key = `${S.kp}|${v}`; (S.custom[key] ||= []).push("Eigenes Kriterium des Betriebs (Text bearbeiten in den Details)"); render(); break; }
    case "submit": S.status = "Eingereicht"; render(); toast("Servicekette eingereicht. Das DTV-SQD-Team wird benachrichtigt."); break;
    case "detail": detailDrawer(k); break;
    case "aitext": { const [kpId, hfk, i] = k.split("|"); document.getElementById("m-text").value = ideaFor({ key: k, hf: hfk, i: +i }) + "."; toast("Formulierung vorgeschlagen"); break; }
    case "savedetail": {
      const [kpId, hfk, iRaw] = k.split("|"); const i = iRaw.startsWith("c") ? iRaw : +iRaw;
      S.notes[k] = document.getElementById("d-note").value.trim();
      const f = readForm(); const ex = S.measures.find(m => m.kp === +kpId && m.hf === hfk && m.crit === i);
      if (f.text) { if (ex) Object.assign(ex, f); else S.measures.push({ id: S.nextId++, kp: +kpId, hf: hfk, crit: i, ...f }); }
      close(); render(); toast(f.text ? "Gespeichert, Maßnahme im Maßnahmenplan" : "Gespeichert"); break; }
    case "bot": botDrawer(v); break;
    case "botq": { const chat = document.getElementById("chat"); const label = el.textContent;
      chat.insertAdjacentHTML("beforeend", `<div class="msg me">${esc(label)}</div>` + botAnswer(v, el.dataset.q)); chat.lastElementChild.scrollIntoView({ block: "nearest" }); break; }
    case "botadd": { const [kpId, hfk, i] = k.split("|");
      if (!S.measures.some(m => m.kp === +kpId && m.hf === hfk && m.crit === +i))
        S.measures.push({ id: S.nextId++, kp: +kpId, hf: hfk, crit: +i, text: ideaFor({ key: k, hf: hfk, i: +i }) + ".", prio: "mittel", status: "offen", resp: suggestResp(+kpId, hfk), start: "", end: "", progress: 0 });
      el.replaceWith(Object.assign(document.createElement("b"), { textContent: "im Maßnahmenplan" })); save(); break; }
    case "aisuggest": {
      const add = [
        { kp: 1, hf: "gk", crit: 1, text: "Die 10 meistbesuchten Seiten ins Englische übersetzen lassen (KI-Übersetzung + Korrektur).", prio: "mittel", resp: ["jk"] },
        { kp: 14, hf: "bf", crit: 0, text: "Absenkbaren Tresenbereich (80 cm) am Counter nachrüsten, Angebot vom Schreiner einholen.", prio: "hoch", resp: ["pb","sh"] }
      ].filter(n => !S.measures.some(m => m.text === n.text));
      add.forEach(n => S.measures.push({ id: S.nextId++, status: "offen", start: "", end: "", progress: 0, ai: true, ...n }));
      render(); toast(add.length ? `${add.length} Vorschläge hinzugefügt` : "Keine neuen Vorschläge"); break; }
    case "aiok": { const m = S.measures.find(x => x.id === +v); delete m.ai; render(); break; }
    case "aidel": S.measures = S.measures.filter(x => x.id !== +v); render(); break;
    case "editm": { const m = S.measures.find(x => x.id === +v);
      drawer(`<header><div><div class="eyebrow">Maßnahme bearbeiten</div><h2>${KP.find(x => x.id === m.kp).name} · ${HF[hfIdx(m.hf)].name}</h2></div><button class="x" data-a="close" aria-label="Schließen">×</button></header>
        ${measureForm(m)}<div class="row"><button class="btn danger" data-a="delm" data-v="${m.id}">Löschen</button><button class="btn" data-a="close">Schließen</button><button class="btn primary" data-a="savem" data-v="${m.id}">Speichern</button></div>`); break; }
    case "savem": { const m = S.measures.find(x => x.id === +v); Object.assign(m, readForm()); delete m.ai; close(); render(); toast("Gespeichert"); break; }
    case "delm": S.measures = S.measures.filter(x => x.id !== +v); close(); render(); break;
    case "approve": S.teamComment = document.getElementById("tc").value; S.status = "Freigegeben"; render(); toast("Freigegeben. Q-Lizenz würde jetzt im CRM angelegt."); break;
    case "reject": S.teamComment = document.getElementById("tc").value; S.status = "Nachbesserung"; render(); toast("Zur Nachbesserung zurückgegeben"); break;
    case "close": close(); break;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target.dataset.f;
  if (f === "scan") {
    S.url = document.getElementById("url").value.trim() || S.url;
    const nb = +document.getElementById("branche").value;
    if (nb !== S.branche) { S.branche = nb; S.kpSel = null; ensureSel(); }
    const steps = ["Startseite und Unterseiten lesen","Impressum, Öffnungszeiten, Anreise","Verlinkte Social-Media-Kanäle","Google-Unternehmensprofil und Bewertungen","Barrierefreiheit (Alternativtexte, Erklärung)"];
    const area = document.getElementById("scanarea");
    area.innerHTML = `<div class="panel"><ul class="scanlog">${steps.map(s => `<li>${s}</li>`).join("")}</ul></div>`;
    const lis = area.querySelectorAll("li"); let i = 0;
    const tick = () => { if (i < lis.length) { lis[i++].className = "done"; setTimeout(tick, 350); } else {
      S.scanned = true; S.sugg = {}; SCAN.forEach(([kp, hf, ix, v, why]) => { S.sugg[`${kp}|${hf}|${ix}`] = { v, why }; }); render(); } };
    setTimeout(tick, 250);
  }
  if (f === "botfree") {
    const inp = document.getElementById("botin"), q = inp.value.trim(); if (!q) return;
    const chat = document.getElementById("chat");
    chat.insertAdjacentHTML("beforeend", `<div class="msg me">${esc(q)}</div><div class="msg bot">Im Klickdummy sind nur die Schnellfragen vorbereitet. Im echten Tool beantwortet hier ein Sprachmodell die Frage mit dem Kriterienkatalog, euren Bewertungen und eurem Team als Kontext.</div>`);
    inp.value = ""; chat.lastElementChild.scrollIntoView({ block: "nearest" });
  }
});

/* Drag & Drop im Kanban */
function bindDnD() {
  document.querySelectorAll(".card").forEach(c => c.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", c.dataset.id); }));
  document.querySelectorAll(".col").forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("over"); });
    col.addEventListener("dragleave", () => col.classList.remove("over"));
    col.addEventListener("drop", e => { e.preventDefault(); const m = S.measures.find(x => x.id === +e.dataTransfer.getData("text/plain")); if (!m) return;
      m.status = col.dataset.col; if (m.status === "erledigt") m.progress = 100; render(); });
  });
}

render();
</script>
