<title>Qool Klickdummy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: App-Shell mit Kopfleiste (DTV-Logo, Qool, Rolle) + Schrittnavigation, darunter je Schritt ein Arbeitsbereich; Bearbeitung zweispaltig. Farben aus Birgits Vorgaben (DTV-Blau #0063a3, Rot #c9070a, Grün #93b05d, Grau #857f76). */
:root {
  --bg: #f6f7f8; --surface: #ffffff; --surface-2: #eef2f6; --fg: #1d2329; --muted: #5d656d; --line: #d9dee3;
  --accent: #0063a3; --accent-soft: #99c1da; --accent-fg: #ffffff;
  --danger: #c9070a; --ok: #93b05d; --warn: #f39100;
  --r0: #9c0b19; --r1: #c9070a; --r2: #f39100; --r3: #93b05d; --r4: #779048; --r5: #5a6e3a; --rn: #b6b2ad;
  --hint-bg: #fff6e5; --hint-fg: #7a4a00; --flag-bg: #fdecec; --flag-fg: #8a0a0c;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13171b; --surface: #1b2127; --surface-2: #222a32; --fg: #e6e9ec; --muted: #9aa3ab; --line: #333c45;
  --accent: #4a9fd8; --accent-soft: #1f4763; --accent-fg: #0b1620; --hint-bg: #3a2c12; --hint-fg: #f5cf8f; --flag-bg: #3d1517; --flag-fg: #ffb3b3; --rn: #6d6964; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #13171b; --surface: #1b2127; --surface-2: #222a32; --fg: #e6e9ec; --muted: #9aa3ab; --line: #333c45;
  --accent: #4a9fd8; --accent-soft: #1f4763; --accent-fg: #0b1620; --hint-bg: #3a2c12; --hint-fg: #f5cf8f; --flag-bg: #3d1517; --flag-fg: #ffb3b3; --rn: #6d6964; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5 }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.2 }
h1 { font-size: 1.75rem } h2 { font-size: 1.35rem } h3 { font-size: 1.1rem }
p { margin: 0 }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.num { font-variant-numeric: tabular-nums }

.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20 }
.top-in { max-width: 1200px; margin: 0 auto; padding: 8px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px }
.brand { display: flex; align-items: center; gap: 14px }
.logo { background: #fff; border-radius: 4px; padding: 3px 6px; display: block; line-height: 0 }
.logo img { height: 44px; width: auto }
.brand-txt { display: grid; line-height: 1.1; border-left: 1px solid var(--line); padding-left: 14px }
.brand-txt b { font-family: var(--font-display); font-size: 1.45rem; color: var(--accent) }
.brand-txt span { color: var(--muted); font-size: .8rem }
.top-meta { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: .85rem }
.top-meta select { width: auto; padding: 3px 8px; font-size: .85rem }
.dummy { background: var(--hint-bg); color: var(--hint-fg); padding: 2px 8px; border-radius: 99px; font-weight: 600; font-size: .75rem; letter-spacing: .03em; text-transform: uppercase }
.role { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden }
.role button { border: 0; background: transparent; padding: 3px 10px; font-size: .8rem }
.role button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg) }
nav.steps { max-width: 1200px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto }
nav.steps button { border: 0; background: none; padding: 8px 12px 10px; border-bottom: 3px solid transparent; white-space: nowrap; color: var(--muted); font-weight: 600 }
nav.steps button[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent) }
nav.steps small { font-weight: 400; margin-right: 4px }

main { max-width: 1200px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: grid; gap: 20px }
.lead { color: var(--muted); max-width: 72ch }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px }
.eyebrow { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600 }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: var(--radius); font-weight: 600 }
.btn:hover:not(:disabled) { border-color: var(--accent) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #142008 }
.btn.danger { color: var(--danger); border-color: var(--danger) }
.btn:disabled { opacity: .45; cursor: not-allowed }
.btn.sm { padding: 4px 10px; font-size: .85rem }
.link { border: 0; background: none; color: var(--accent); padding: 0; font-weight: 600; text-decoration: underline; text-underline-offset: 2px }

.hint { background: var(--hint-bg); color: var(--hint-fg); border-radius: var(--radius); padding: 10px 14px; font-size: .9rem }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 99px; font-size: .75rem; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap }
.chip.ai { background: var(--accent-soft); color: var(--fg) }
.chip.flag { background: var(--flag-bg); color: var(--flag-fg) }
.chip.own { background: var(--ok); color: #142008 }
.pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-weight: 700; font-size: .8rem }
.st-Entwurf { background: var(--surface-2) } .st-Eingereicht { background: var(--accent-soft) } .st-Nachbesserung { background: var(--warn); color: #2b1a00 } .st-Freigegeben { background: var(--ok); color: #142008 }
label.f { display: grid; gap: 4px; font-size: .85rem; font-weight: 600 }
input[type=text], input[type=date], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; width: 100%; min-width: 0 }
textarea { min-height: 80px; resize: vertical }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.kpi { background: var(--accent-soft); border-radius: var(--radius); padding: 10px 12px }
.kpi .eyebrow { color: var(--fg); opacity: .75 }
.kpi b { display: block; font-size: 1.15rem; font-family: var(--font-display) }
.bar { height: 6px; background: var(--surface); border-radius: 99px; overflow: hidden; margin-top: 6px }
.bar i { display: block; height: 100%; background: var(--accent) }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px }
.tile { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 8px; background: var(--surface); align-content: start }
.tile.done { border-color: var(--ok); box-shadow: inset 4px 0 0 var(--ok) }
.tile.locked { opacity: .6 }
.team { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px }
.team li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center }
.av { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; font-size: .72rem; font-weight: 700; flex: none }
.av.sm { width: 22px; height: 22px; font-size: .62rem }
svg text { fill: var(--fg) }

.phase { display: grid; gap: 10px }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px }
.sel { position: relative; border: 2px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 12px 12px 10px; text-align: left; display: grid; gap: 6px; min-height: 104px; align-content: start }
.sel[aria-pressed="true"] { border-color: var(--accent); background: var(--surface-2) }
.sel .ic { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700 }
.sel .nm { font-weight: 600; line-height: 1.25 }
.sel .meta { font-size: .75rem; color: var(--muted) }
.sel .lock { position: absolute; top: 8px; right: 8px; font-size: .8rem }
.sel .info { position: absolute; bottom: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: .75rem; font-weight: 700; display: grid; place-items: center }
.warnx { color: var(--danger); font-weight: 600 }

.assign { display: grid; grid-template-columns: minmax(0, 1fr) 200px 70px; gap: 8px 14px; align-items: center }
.assign > .h { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600 }
@media (max-width: 560px) { .assign { grid-template-columns: minmax(0, 1fr) 150px } .assign .cnt { display: none } }
.load { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px }
.load div { background: var(--surface-2); border-radius: var(--radius); padding: 8px 10px; display: grid; grid-template-columns: 28px 1fr; gap: 2px 10px; align-items: center }
.load small { grid-column: 2; color: var(--muted) }

.work { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start }
@media (max-width: 860px) { .work { grid-template-columns: 1fr } }
.kpside { display: grid; gap: 0; position: sticky; top: 118px; max-height: calc(100vh - 136px); overflow: auto }
@media (max-width: 860px) { .kpside { position: static; max-height: none } }
.kpside .filter { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line) }
.kpside .filter button { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 4px; font-size: .8rem; font-weight: 600 }
.kpside .filter button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent) }
.kplist { list-style: none; margin: 0; padding: 6px; display: grid; gap: 2px }
.kplist button { width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 4px; display: grid; grid-template-columns: 12px 1fr auto auto; gap: 8px; align-items: center }
.kplist button[aria-current="true"] { background: var(--surface-2); font-weight: 700 }
.dot { width: 12px; height: 12px; border-radius: 50% }
.d-rot { background: var(--danger) } .d-orange { background: var(--warn) } .d-gruen { background: var(--ok) } .d-leer { background: var(--rn) }
.legend { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: .8rem }
.legend span { display: inline-flex; gap: 5px; align-items: center }
.legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block }
.hf { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 4px }
.hf-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 4px }
.crit { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px 12px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line) }
@media (max-width: 640px) { .crit { grid-template-columns: 1fr auto } .crit .scale { grid-column: 1 / -1 } }
.crit .t small { display: block; color: var(--muted) }
.scale { display: flex; gap: 3px }
.scale button { width: 32px; height: 32px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; padding: 0 }
.scale button[aria-pressed="true"] { color: #fff; border-color: transparent }
.kpfoot { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 14px }
.avg { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700 }

.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40 }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(540px, 100%); background: var(--surface); z-index: 41; overflow: auto; padding: calc(18px + env(safe-area-inset-top, 0px)) 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; align-content: start; box-shadow: -8px 0 24px rgba(0,0,0,.15) }
.drawer header { display: flex; justify-content: space-between; gap: 10px; align-items: start }
.x { border: 0; background: none; font-size: 1.4rem; line-height: 1; padding: 2px 6px }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; font-size: .9rem }
dl.kv dt { color: var(--muted) } dl.kv dd { margin: 0 }
.expl { display: grid; gap: 4px; font-size: .85rem }
.expl div { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start }
.expl b { color: #fff; border-radius: 3px; text-align: center }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .9rem }
.checks label { display: inline-flex; gap: 6px; align-items: center }
.fb { border: 1px solid var(--accent-soft); border-radius: var(--radius); padding: 12px; display: grid; gap: 8px; background: var(--surface-2) }
.fb ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .9rem }
.fb li { display: grid; grid-template-columns: 20px 1fr; gap: 6px }
.fb .y { color: var(--r5); font-weight: 700 } .fb .n { color: var(--danger); font-weight: 700 }
.fb q { font-style: italic }
.chat { display: grid; gap: 10px }
.msg { padding: 10px 12px; border-radius: 8px; max-width: 92%; font-size: .92rem }
.msg.bot { background: var(--surface-2) }
.msg.me { background: var(--accent); color: var(--accent-fg); justify-self: end }
.msg ul { margin: 6px 0 0; padding-left: 18px }

.fab { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 30; width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.25) }
.fab[hidden] { display: none }
.fab:hover { filter: brightness(1.08) }
.fab svg { width: 30px; height: 30px; fill: currentColor }
.fab .tip { position: absolute; right: 70px; white-space: nowrap; background: var(--fg); color: var(--bg); font-size: .8rem; font-weight: 600; padding: 4px 10px; border-radius: 99px; opacity: 0; pointer-events: none; transition: opacity .15s }
.fab:hover .tip, .fab:focus-visible .tip { opacity: 1 }
.hfpick { display: flex; flex-wrap: wrap; gap: 6px }
.hfpick button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 3px 10px; font-size: .8rem; font-weight: 600 }
.hfpick button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent) }
.msg.bot { border-bottom-left-radius: 2px } .msg.me { border-bottom-right-radius: 2px }
.st-Abgelaufen { background: var(--rn); color: var(--fg) }
tr.clk { cursor: pointer } tr.clk:hover td { background: var(--surface-2) }
table.blist td { vertical-align: middle }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto }
.tabs button { border: 0; background: none; padding: 8px 14px; border-bottom: 3px solid transparent; font-weight: 600; color: var(--muted); white-space: nowrap }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent) }
table.grid td, table.grid th { text-align: center } table.grid td:first-child, table.grid th:first-child { text-align: left }
.sc { display: inline-block; min-width: 38px; padding: 1px 6px; border-radius: 4px; color: #fff; font-weight: 700; font-size: .85rem }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0 }
.timeline li { display: grid; grid-template-columns: 100px 1fr; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line) }
.timeline li:last-child { border-bottom: 0 }
.timeline small { display: block; color: var(--muted) }
.timeline p { margin-top: 4px }
.tdate { color: var(--muted) }
.modal { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(760px, calc(100% - 24px)); max-height: calc(100% - 32px); overflow: auto; background: var(--surface); border-radius: 10px; padding: 20px; display: grid; gap: 16px; box-shadow: 0 16px 48px rgba(0,0,0,.3) }
.stepper { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px }
.stepper button { width: 100%; border: 0; background: none; padding: 6px 0 8px; border-bottom: 3px solid var(--line); display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: .85rem; color: var(--muted); text-align: left }
.stepper .n { width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: .75rem; flex: none }
.stepper li.cur button { color: var(--fg); border-bottom-color: var(--accent) } .stepper li.cur .n { background: var(--accent); color: var(--accent-fg) }
.stepper li.done button { color: var(--fg); border-bottom-color: var(--ok) } .stepper li.done .n { background: var(--ok); color: #142008 }
@media (max-width: 600px) { .stepper button { font-size: 0; gap: 0; justify-content: center } .stepper .n { font-size: .75rem } }
.mbody { display: grid; gap: 14px }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
.fgrid .wide { grid-column: 1 / -1 }
@media (max-width: 560px) { .fgrid { grid-template-columns: 1fr } }
input[type=email], input[type=tel] { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; width: 100%; min-width: 0 }
.req { color: var(--danger) }
.ferr { color: var(--danger); font-weight: 400; font-size: .8rem }
.ferr.box { background: var(--flag-bg); color: var(--flag-fg); padding: 8px 12px; border-radius: var(--radius); font-size: .9rem }
fieldset.contact { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin: 0; display: grid; gap: 10px }
fieldset.contact legend { font-weight: 700; padding: 0 6px; font-family: var(--font-display) }
.sum { background: var(--surface-2); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 2px }
.sel-text { user-select: all }
.st-Eingeladen { background: var(--accent-soft) } .st-Angelegt { background: var(--surface-2) }
.kanban { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start }
@media (max-width: 860px) { .kanban { grid-template-columns: 1fr } }
.col { background: var(--surface-2); border-radius: var(--radius); padding: 10px; display: grid; gap: 8px; min-height: 160px; align-content: start }
.col.over { outline: 2px dashed var(--accent) }
.col h3 { display: flex; justify-content: space-between }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; display: grid; gap: 6px; cursor: grab }
.card .src { font-size: .78rem; color: var(--muted) }
.prio-hoch { background: var(--danger); color: #fff } .prio-mittel { background: var(--warn); color: #2b1a00 } .prio-niedrig { background: var(--surface-2); color: var(--fg) }
.avs { display: flex; gap: 2px }

.flags { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
.flags li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; padding: 10px 12px; border-radius: var(--radius); background: var(--flag-bg); color: var(--flag-fg) }
.flags li.info { background: var(--surface-2); color: var(--fg) }
.flags b { font-weight: 700 }
.flags small { display: block; opacity: .85 }
.origin { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--surface-2) }
.origin i { display: block; height: 100% }
table.t { width: 100%; border-collapse: collapse; font-size: .9rem }
table.t th, table.t td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line) }
.tw { overflow-x: auto }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 99px; z-index: 60; font-weight: 600; max-width: calc(100% - 32px); text-align: center }
@media (prefers-reduced-motion: no-preference) { .toast { animation: up .2s ease-out } @keyframes up { from { transform: translate(-50%, 8px); opacity: 0 } } }
</style>

<header class="top">

const VAGUE = /\b(verbessern|optimieren|prüfen|überprüfen|mehr|besser|ggf|eventuell|irgendwann|anpassen)\b/i;
function measureFeedback(m, critT) {
  const t = (m.text || "").trim();
  const words = s => new Set(s.toLowerCase().match(/[a-zäöüß]{5,}/g) || []);
  const cw = words(critT), tw = words(t);
  const overlap = [...tw].some(w => [...cw].some(c => c.slice(0, 6) === w.slice(0, 6)));
  const checks = [
    [t.length >= 40, "Konkret beschrieben", "Noch sehr knapp. Was genau wird getan, wo und womit?"],
    [!VAGUE.test(t) || /\d/.test(t), "Messbar formuliert", "Woran merkt ihr, dass die Maßnahme erledigt ist? Eine Zahl, ein Ort oder ein Ergebnis hilft."],
    [overlap, "Bezug zum Kriterium erkennbar", "Der Bezug zum Kriterium ist nicht erkennbar. Welche Schwachstelle löst die Maßnahme?"],
    [m.resp?.length > 0, "Verantwortliche festgelegt", "Wer kümmert sich darum? Bitte mindestens eine Person auswählen."],
    [!!m.end, "Termin gesetzt", "Bis wann soll die Maßnahme umgesetzt sein?"]
  ];
  const q = ["Was würde ein Gast nach der Umsetzung anders erleben?", "Was müsstet ihr dafür als Erstes tun?", "Gibt es etwas, das ihr mit wenig Aufwand schon nächste Woche ändern könnt?"];
  return { checks, score: checks.filter(c => c[0]).length, question: q[t.length % q.length] };
}

const NEG = /\b(nicht|kein|keine|fehlt|defekt|kaputt|stufe|zu hoch|zu klein)\b/i;
function plausibility() {
  const out = [];
  selKps().forEach(k => {

    if (s.nums.length >= 4 && s.nums.every(v => v === 5)) out.push({ sev: "flag", kp: k.id, t: "Nur Höchstwerte", d: `Alle ${s.nums.length} bewerteten Kriterien mit 5, ohne Notiz. Nachfragen, ob realistisch bewertet wurde.` });
    critsOf(k).forEach(c => {
      const v = S.ratings[c.key], note = S.notes[c.key];
      if (typeof v === "number" && v >= 4 && note && NEG.test(note)) out.push({ sev: "flag", kp: k.id, key: c.key, t: "Notiz passt nicht zur Bewertung", d: `„${critText(k.id, c.hf, c.i)}“ mit ${v} bewertet, Notiz: „${note}“` });
      if (typeof v === "number" && v <= 1 && !S.measures.some(m => m.kp === k.id && m.hf === c.hf && m.crit === c.i)) out.push({ sev: "flag", kp: k.id, key: c.key, t: "Schwachstelle ohne Maßnahme", d: `„${critText(k.id, c.hf, c.i)}“ mit ${v} bewertet, aber keine Maßnahme hinterlegt.` });
    });
    const done = critsOf(k).filter(c => S.ratings[c.key] !== undefined), ns = done.filter(c => S.ratings[c.key] === "N");
    if (done.length >= 4 && ns.length / done.length > .5) out.push({ sev: "info", kp: k.id, t: "Viele „N“", d: `${ns.length} von ${done.length} Kriterien als nicht relevant markiert.` });
  });
  S.measures.forEach(m => { const f = measureFeedback(m, critText(m.kp, m.hf, m.crit)); if (f.score <= 2) out.push({ sev: "flag", kp: m.kp, t: "Maßnahme zu unkonkret", d: `„${m.text}“ erfüllt nur ${f.score} von 5 Punkten (konkret, messbar, Bezug, Verantwortliche, Termin).` }); });
  return out;
}

function spider(vals) {
  const cx = 170, cy = 150, R = 105, n = vals.length;
  const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; };
  let g = "";
  for (let lv = 1; lv <= 5; lv++) g += `<polygon points="${vals.map((_, i) => pt(i, R * lv / 5).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  vals.forEach((_, i) => { const [x, y] = pt(i, R); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`; });
  [1,3,5].forEach(lv => { g += `<text x="${cx + 4}" y="${cy - R * lv / 5 + 4}" font-size="10" opacity=".6">${lv}</text>`; });
  if (vals.filter(v => v.avg !== null).length >= 3) {
    g += `<polygon points="${vals.map((v, i) => pt(i, R * (v.avg ?? 0) / 5).join(",")).join(" ")}" fill="var(--accent-soft)" fill-opacity=".75" stroke="var(--accent)" stroke-width="2"/>`;
    vals.forEach((v, i) => { if (v.avg !== null) { const [x, y] = pt(i, R * v.avg / 5); g += `<circle cx="${x}" cy="${y}" r="4" fill="var(--accent)"/>`; } });
  }
  vals.forEach((v, i) => {
    const [x, y] = pt(i, R + 20); const anchor = Math.abs(x - cx) < 5 ? "middle" : x > cx ? "start" : "end";
    g += `<text x="${x}" y="${y}" font-size="11.5" text-anchor="${anchor}" opacity="${v.active ? 1 : .45}">${v.h.short} ${fmt(v.avg)}</text>`;
  });
  return `<svg viewBox="0 0 340 300" width="100%" style="max-width:380px" role="img" aria-label="Spinnendiagramm Durchschnitt je Handlungsfeld">${g}</svg>`;
}

function vEdit() {

  if (kps.length && !kps.find(k => k.id === S.kp)) S.kp = kps[0].id;
  const kp = kpById(S.kp), st = kpStats(kp), o = overall();
  const allDone = o.t > 0 && o.d === o.t;
  const locked = S.status === "Eingereicht" || S.status === "Freigegeben" || S.role === "team";
  const owner = S.assign[kp.id];

  return `

    <aside class="panel kpside" style="padding:0">
      ${S.role === "betrieb" ? `<div class="filter"><button data-a="mine" data-v="1" aria-pressed="${S.mine}">Meine (${all.filter(k => S.assign[k.id] === S.me).length})</button><button data-a="mine" data-v="0" aria-pressed="${!S.mine}">Alle (${all.length})</button></div>` : ""}

    </aside>
    <section class="panel" style="display:grid;gap:14px;min-width:0">
      ${S.role === "team" ? '<div><button class="link" data-a="go" data-v="betrieb">← Zurück zur Prüfung</button></div>' : ""}

        <div class="eyebrow">Kontaktpunkt ${kp.id} · ${PHASEN[brType()][kp.phase]}</div>

          ${owner ? `<span class="row" style="gap:6px"><span class="av">${ini(member(owner).name)}</span><span>zuständig: ${member(owner).name}</span></span>` : '<span class="chip flag">noch niemand zuständig</span>'}</div>
        <p class="lead">${esc(KPDEF[kp.id] || "Begriffserläuterung folgt vom DTV.")}</p>
      </div>
      <div class="legend">${SCALE.map(s => `<span><i style="background:${SCORE[s][1]}"></i>${s} = ${SCORE[s][0]}</span>`).join("")}</div>
      ${S.role === "betrieb" && owner && owner !== S.me && !locked ? `<div class="hint">Diesen Kontaktpunkt bewertet ${member(owner).name}. Du kannst trotzdem reinschauen und ergänzen.</div>` : ""}

        const cnt = kp.hf[hfIdx(h.k)], custom = S.custom[`${kp.id}|${h.k}`] || [];

        return `<div class="hf">
          <div class="hf-head"><h3>${h.name}</h3>${EXAMPLE_TEXT(kp.id, h.k) ? '<span class="chip">Beispieltexte</span>' : ""}</div>
          ${Array.from({ length: cnt }, (_, i) => critRow(kp, h, i, locked)).join("")}

    </section>
  </div>`;
}
function critRow(kp, h, i, locked, customText) {
  const key = `${kp.id}|${h.k}|${i}`, v = S.ratings[key];
  const text = customText ?? critText(kp.id, h.k, i);
  const hasM = S.measures.some(m => m.kp === kp.id && m.hf === h.k && m.crit === i);
  const contra = typeof v === "number" && v >= 4 && S.notes[key] && NEG.test(S.notes[key]);
  const needM = typeof v === "number" && v <= 1 && !hasM && !customText;
  return `<div class="crit">
    <div class="t">${customText ? '<span class="chip">eigenes Kriterium</span> ' : ""}${esc(text)}
      ${S.notes[key] ? `<small>Notiz: ${esc(S.notes[key])}</small>` : ""}
      ${contra ? '<span class="chip flag">Bitte prüfen: Notiz passt nicht zur Bewertung</span>' : ""}
      ${needM ? '<span class="chip flag">Maßnahme fehlt</span>' : ""}</div>
    <div class="scale" role="radiogroup" aria-label="Bewertung">${SCALE.map(s => `<button data-a="rate" data-k="${key}" data-v="${s}" aria-pressed="${v === s}" style="${v === s ? `background:${SCORE[s][1]}` : ""}" ${locked ? "disabled" : ""} title="${SCORE[s][0]}">${s}</button>`).join("")}</div>
    <button class="btn sm" data-a="detail" data-k="${key}">${hasM ? "Maßnahme ✓" : "Details"}</button>
  </div>`;
}

function vPlan() {
  const cols = [["offen","Zu erledigen"],["in Bearbeitung","In Bearbeitung"],["erledigt","Erledigt"]];

function card(m) {
  const kp = kpById(m.kp), h = HF[hfIdx(m.hf)], f = measureFeedback(m, critText(m.kp, m.hf, m.crit));
  return `<article class="card" draggable="true" data-id="${m.id}">

    <div class="row" style="justify-content:space-between">
      <div class="avs">${m.resp.map(r => `<span class="av sm" title="${member(r).name}">${ini(member(r).name)}</span>`).join("") || '<span class="chip flag">niemand zuständig</span>'}</div>

  </article>`;
}

function validate(step) {
  const e = {}, s = wiz.stamm, q = wiz.q;
  if (step === 0) {
    if (!s.name.trim()) e["stamm.name"] = "Bitte den Namen angeben.";
    if (s.br === "" || s.br === undefined) e["stamm.br"] = "Bitte eine Branche wählen.";
    if (!s.strasse.trim()) e["stamm.strasse"] = "Bitte die Adresse angeben.";
    if (!/^\d{5}$/.test(s.plz.trim())) e["stamm.plz"] = "Fünfstellige PLZ angeben.";
    if (!s.ort.trim()) e["stamm.ort"] = "Bitte den Ort angeben.";
  }
  if (step === 1) {
    const seen = new Set();
    wiz.contacts.forEach((c, i) => {
      if (!c.vn.trim()) e[`c${i}.vn`] = "Pflichtfeld";
      if (!c.nn.trim()) e[`c${i}.nn`] = "Pflichtfeld";
      const m = c.email.trim().toLowerCase();
      if (!EMAIL.test(m)) e[`c${i}.email`] = "Bitte eine gültige E-Mail-Adresse angeben.";
      else if (seen.has(m)) e[`c${i}.email`] = "Diese E-Mail-Adresse ist schon vergeben."; else seen.add(m);
    });
    if (!wiz.contacts.some(c => c.kord)) e.contacts = "Mindestens eine Kontaktperson muss Koordinator/in mit KORD3-Lizenz sein. Ohne KORD3 kann Q nicht gebucht werden.";
    else if (!wiz.contacts.some(c => c.main)) e.contacts = "Bitte eine Hauptansprechperson festlegen.";
  }
  if (step === 2) {
    ["start","frist","einreichung"].forEach(k => { if (!q[k]) e[`q.${k}`] = "Pflichtfeld"; });
    if (q.frist && q.start && q.frist <= q.start) e["q.frist"] = "Muss nach dem Start liegen.";
    if (q.einreichung && q.frist && q.einreichung < q.frist) e["q.einreichung"] = "Darf nicht vor der Bearbeitungsfrist liegen.";
  }
  wiz.err = e; return !Object.keys(e).length;
}

      <button class="btn sm" data-a="botq" data-v="${hfk}" data-q="who">Wer ist bei uns zuständig?</button>
      <button class="btn sm" data-a="botq" data-v="${hfk}" data-q="think">Denkanstöße</button>
      <button class="btn sm" data-a="botq" data-v="${hfk}" data-q="explain">Was heißt „N“?</button>
    </div>
    <form class="row" data-f="botfree" style="flex-wrap:nowrap"><input type="text" id="botin" placeholder="Frage eingeben…" aria-label="Frage an den Assistenten"><button class="btn primary" type="submit">Senden</button></form>
    <p style="font-size:.8rem;color:var(--muted)">Klickdummy: Antworten sind vorbereitet.</p>`);
}
function botAnswer(hfk, q) {
  if (q === "who") return `<div class="msg bot">${BOT[hfk]}</div>`;
  if (q === "explain") return `<div class="msg bot">„N“ heißt: Das Kriterium gibt es bei euch nicht und es ist auch nicht relevant. N fließt nicht in den Durchschnitt ein. Wenn etwas fehlt, aber sinnvoll wäre, nehmt 0.</div>`;
  return `<div class="msg bot">Ein paar Fragen zum Nachdenken, bevor ihr Maßnahmen formuliert:<ul>${THINK[hfk].map(t => `<li>${t}</li>`).join("")}</ul></div>`;
}

/* ---------- Aktionen ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v, k = el.dataset.k;
  if (a === "kpinfo" || a === "hfinfo") e.stopPropagation();
  switch (a) {
    case "go": S.view = v; close(); render(); scrollTo(0, 0); break;
    case "role": S.role = v; S.view = v === "team" ? "betriebe" : "dash"; close(); render(); break;
    case "bfilter": S.bfilter = v; render(); break;
    case "openb": e.stopPropagation(); S.openB = v; S.btab = ["Eingeladen","Angelegt"].includes(modelById(v).status) ? "stamm" : "pruefung"; S.view = "betrieb"; render(); scrollTo(0, 0); break;
    case "btab": S.btab = v; render(); break;
    case "wopen": openWizard(); break;
    case "wedit": openWizard(v); if (el.dataset.s) { wiz.step = 1; renderWizard(); } break;
    case "wclose": wiz = null; close(); break;
    case "wnext": if (validate(wiz.step)) wiz.step++; renderWizard(); break;
    case "wback": wiz.step--; wiz.err = {}; renderWizard(); break;
    case "wgo": if (+v <= wiz.step) { wiz.step = +v; wiz.err = {}; renderWizard(); } break;
    case "wadd": wiz.contacts.push(emptyContact()); renderWizard(); layer.querySelectorAll("fieldset.contact")[wiz.contacts.length - 1]?.querySelector("input")?.focus(); break;
    case "wdel": { const wasMain = wiz.contacts[+v].main; wiz.contacts.splice(+v, 1); if (wasMain) wiz.contacts[0].main = true; renderWizard(); break; }
    case "wsave": for (let i = 0; i < 3; i++) if (!validate(i)) { wiz.step = i; renderWizard(); toast("Bitte die markierten Felder prüfen"); return; } saveWizard(); break;
    case "reset": try { localStorage.removeItem(KEY); } catch (er) {} S = fresh(); ensureSel(); render(); toast("Dummy zurückgesetzt"); break;
    case "kp": { const kp = kpById(v); if (flag(kp) === "P") { toast("Pflicht-Kontaktpunkt, kann nicht abgewählt werden"); break; }
      S.kpSel = S.kpSel.includes(kp.id) ? S.kpSel.filter(x => x !== kp.id) : [...S.kpSel, kp.id]; render(); break; }
    case "kpinfo": { const kp = kpById(v); infoDrawer(kp.name, KPDEF[kp.id] || "Die Definition dieses Kontaktpunkts liefert der DTV."); break; }
    case "hf": if (HF[hfIdx(v)].lock) { toast("Gast/Kunde ist Pflicht"); break; }
      S.hfSel = S.hfSel.includes(v) ? S.hfSel.filter(x => x !== v) : [...S.hfSel, v]; render(); break;
    case "hfinfo": { const h = HF[hfIdx(v)]; infoDrawer(h.name, h.def); break; }
    case "autoassign": selKps().forEach(kp => { S.assign[kp.id] = ROLE_FOR_KP[kp.id] || "my"; }); render(); toast("Nach Rollen verteilt"); break;
    case "mine": S.mine = v === "1"; render(); break;
    case "selkp": S.kp = +v; render(); scrollTo(0, 0); break;
    case "openkp": if (v) S.kp = +v; S.view = "edit"; render(); scrollTo(0, 0); break;
    case "rate": { const val = v === "N" ? "N" : +v; if (S.ratings[k] === val) delete S.ratings[k]; else S.ratings[k] = val; render(); break; }
    case "nextkp": { const ks = selKps().filter(x => !S.mine || S.assign[x.id] === S.me); const i = ks.findIndex(x => x.id === S.kp); if (ks.length) S.kp = ks[(i + 1) % ks.length].id; render(); scrollTo(0, 0); toast("Zwischengespeichert"); break; }
    case "addcustom": { const key = `${S.kp}|${v}`; (S.custom[key] ||= []).push("Eigenes Kriterium des Betriebs"); render(); break; }
    case "submit": S.status = "Eingereicht"; S.submitted = today(); S.history.unshift({ d: today(), t: S.history.some(h => h.t === "Eingereicht" && h.d > "2026") ? "Erneut eingereicht" : "Eingereicht", by: member(S.me).name }); render(); toast("Servicekette eingereicht. Das DTV-SQD-Team wird benachrichtigt."); break;
    case "detail": detailDrawer(k); break;
    case "feedback": renderFeedback(el.dataset.c); break;
    case "savedetail": {
      const [kpId, hfk, iRaw] = k.split("|"); const i = iRaw.startsWith("c") ? iRaw : +iRaw;
      S.notes[k] = document.getElementById("d-note").value.trim(); if (!S.notes[k]) delete S.notes[k];
      const f = readForm(); const ex = S.measures.find(m => m.kp === +kpId && m.hf === hfk && m.crit === i);
      if (f.text) { if (ex) Object.assign(ex, f, { origin: draftOrigin }); else S.measures.push({ id: S.nextId++, kp: +kpId, hf: hfk, crit: i, origin: draftOrigin, ...f }); }
      close(); render(); toast(f.text ? "Gespeichert, Maßnahme im Maßnahmenplan" : "Gespeichert"); break; }
    case "bot": botDrawer(v); break;
    case "botq": { const chat = document.getElementById("chat");
      chat.insertAdjacentHTML("beforeend", `<div class="msg me">${esc(el.textContent)}</div>` + botAnswer(v, el.dataset.q)); chat.lastElementChild.scrollIntoView({ block: "nearest" }); break; }
    case "editm": { const m = S.measures.find(x => x.id === +v), ct = critText(m.kp, m.hf, m.crit); draftOrigin = m.origin || "eigen";
      drawer(`<header><div><div class="eyebrow">Maßnahme bearbeiten</div><h2>${kpById(m.kp).name} · ${HF[hfIdx(m.hf)].name}</h2></div><button class="x" data-a="close" aria-label="Schließen">×</button></header>
        <p class="lead" style="font-size:.9rem">Kriterium: ${esc(ct)}</p>
        ${measureForm(m, ct, S.role === "team")}<div class="row">${S.role === "team" ? "" : `<button class="btn danger" data-a="delm" data-v="${m.id}">Löschen</button>`}<button class="btn" data-a="close">Schließen</button>${S.role === "team" ? "" : `<button class="btn primary" data-a="savem" data-v="${m.id}">Speichern</button>`}</div>`); break; }
    case "savem": { const m = S.measures.find(x => x.id === +v); Object.assign(m, readForm(), { origin: draftOrigin }); close(); render(); toast("Gespeichert"); break; }
    case "delm": S.measures = S.measures.filter(x => x.id !== +v); close(); render(); break;
    case "cite": { const tc = document.getElementById("tc"); tc.value = (tc.value ? tc.value + "\n" : "") + "• " + v; if (S.openB === "ti") S.teamComment = tc.value; else S.bcomment[S.openB] = tc.value; save(); toast("In den Kommentar übernommen"); break; }
    case "approve": decide(true); break;
    case "reject": decide(false); break;
    case "close": close(); break;
  }
});
document.addEventListener("change", e => {
  if (wiz && (e.target.dataset.w || e.target.dataset.c)) { wizInput(e.target); return; }
  if (e.target.id === "me") { S.me = e.target.value; render(); }
  if (e.target.id === "branche") { S.branche = +e.target.value; S.kpSel = null; ensureSel(); render(); }
  if (e.target.dataset.assign) { const id = e.target.dataset.assign; if (e.target.value) S.assign[id] = e.target.value; else delete S.assign[id]; render(); }
  if (e.target.id === "tc") { if (S.openB === "ti") S.teamComment = e.target.value; else S.bcomment[S.openB] = e.target.value; save(); }
});
document.addEventListener("input", e => { if (wiz && (e.target.dataset.w || e.target.dataset.c)) wizInput(e.target);
  if (e.target.id === "bq") { const q = e.target.value.trim().toLowerCase(); document.querySelectorAll("tr[data-search]").forEach(r => { r.hidden = !!q && !r.dataset.search.includes(q); }); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { wiz = null; close(); } });
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.dataset.f === "botfree") {
    const inp = document.getElementById("botin"), q = inp.value.trim(); if (!q) return;
    const chat = document.getElementById("chat");
    chat.insertAdjacentHTML("beforeend", `<div class="msg me">${esc(q)}</div><div class="msg bot">Im Klickdummy sind nur die Schnellfragen vorbereitet. Im echten Tool beantwortet hier ein Sprachmodell die Frage mit dem Kriterienkatalog und eurem Team als Kontext. Fertige Maßnahmen schreibt es bewusst nicht.</div>`);
    inp.value = ""; chat.lastElementChild.scrollIntoView({ block: "nearest" });
  }
});

/* Drag & Drop im Kanban */
function bindDnD() {
  document.querySelectorAll(".card").forEach(c => c.addEventListener("dragstart", e => { e.dataTransfer.setData("text/plain", c.dataset.id); }));
  document.querySelectorAll(".col").forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("over"); });
    col.addEventListener("dragleave", () => col.classList.remove("over"));
    col.addEventListener("drop", e => { e.preventDefault(); const m = S.measures.find(x => x.id === +e.dataTransfer.getData("text/plain")); if (!m) return;
      m.status = col.dataset.col; if (m.status === "erledigt") m.progress = 100; render(); });
  });
}

render();
</script>
