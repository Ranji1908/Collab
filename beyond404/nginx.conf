server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location ~* \.(css|js|svg)$ { expires 7d; add_header Cache-Control "public"; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}
